<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week13/blue_loop_example.png?raw=true" width="500" align="right" /></p>
<p><strong>Blue Loop</strong>: an evolved star changes from a <em>cool</em> star to a <em>hotter</em> one before <em>cooling</em> again.</p>
<ul>
<li data-marpit-fragment="1"><strong>E</strong> - at the tip of the RGB, helium is <strong>ingnited</strong> in the core as stable.
<ul>
<li data-marpit-fragment="2"><strong>luminosity decreases</strong> while the envelope is convective - the star moves along the Hayashi line.</li>
</ul>
</li>
</ul>
</section>

<header>AST400A</header>
<h3 id="the-asymptotic-giant-branch-agb">The Asymptotic Giant Branch (AGB)</h3>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/kipp_agb.png?raw=true" width="500" align="right" /></p>
<p>The AGB phase starts at the exhaustion of helium in the center.</p>
<p>We can identify 3 main phases of a star on the AGB:</p>
<ol>
<li>The <em>early AGB phase</em> - point <strong>H</strong></li>
</ol>
<p>Kippenhahn diagram for a 5<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.472ex;" xmlns="http://www.w3.org/2000/svg" width="3.627ex" height="2.017ex" role="img" focusable="false" viewBox="0 -683 1603.1 891.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D440" d="M289 629Q289 635 232 637Q208 637 201 638T194 648Q194 649 196 659Q197 662 198 666T199 671T201 676T203 679T207 681T212 683T220 683T232 684Q238 684 262 684T307 683Q386 683 398 683T414 678Q415 674 451 396L487 117L510 154Q534 190 574 254T662 394Q837 673 839 675Q840 676 842 678T846 681L852 683H948Q965 683 988 683T1017 684Q1051 684 1051 673Q1051 668 1048 656T1045 643Q1041 637 1008 637Q968 636 957 634T939 623Q936 618 867 340T797 59Q797 55 798 54T805 50T822 48T855 46H886Q892 37 892 35Q892 19 885 5Q880 0 869 0Q864 0 828 1T736 2Q675 2 644 2T609 1Q592 1 592 11Q592 13 594 25Q598 41 602 43T625 46Q652 46 685 49Q699 52 704 61Q706 65 742 207T813 490T848 631L654 322Q458 10 453 5Q451 4 449 3Q444 0 433 0Q418 0 415 7Q413 11 374 317L335 624L267 354Q200 88 200 79Q206 46 272 46H282Q288 41 289 37T286 19Q282 3 278 1Q274 0 267 0Q265 0 255 0T221 1T157 2Q127 2 95 1T58 0Q43 0 39 2T35 11Q35 13 38 25T43 40Q45 46 65 46Q135 46 154 86Q158 92 223 354T289 629Z"></path></g><g data-mml-node="TeXAtom" transform="translate(1003,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mo"><path data-c="2299" d="M56 250Q56 394 156 488T384 583Q530 583 626 485T722 250Q722 110 625 14T390 -83Q249 -83 153 14T56 250ZM682 250Q682 322 649 387T546 497T381 542Q272 542 184 459T95 250Q95 132 178 45T389 -42Q515 -42 598 45T682 250ZM311 250Q311 285 332 304T375 328Q376 328 382 328T392 329Q424 326 445 305T466 250Q466 217 445 195T389 172Q354 172 333 195T311 250Z"></path></g></g></g></g></g></svg></mjx-container> star during late evolutionary phases.</p>

<header>AST400A</header>
<h4 id="asymptotic-giant-branch-agb---the-early-agb-phase">Asymptotic Giant Branch (AGB) - The <em>early AGB phase</em></h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/kipp_agb.png?raw=true" width="500" align="right" /></p>
<p>The <em>early AGB phase</em> - point <strong>H</strong>:</p>
<ul>
<li data-marpit-fragment="1">After He-depletion:
<ul>
<li>all the material below the H-shell contracts until burning proceeds in a He-shell surrounding the now CO core.</li>
</ul>
<ul>
<li data-marpit-fragment="2">For a brief period of time, the star has <strong>two</strong> active burning shells.</li>
</ul>
</li>
</ul>
<p>We see this about at 106 Myr.</p>
</section>

<header>AST400A</header>
<h4 id="asymptotic-giant-branch-agb---the-early-agb-phase-1">Asymptotic Giant Branch (AGB) - The <em>early AGB phase</em></h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/kipp_agb.png?raw=true" width="500" align="right" /></p>
<ul>
<li data-marpit-fragment="1">
<p>He-rich zone expands:</p>
<ul>
<li data-marpit-fragment="2">the H-burning shell <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.593ex" height="1.532ex" role="img" focusable="false" viewBox="0 -677 704 677"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z"></path></g></g></g></svg></mjx-container> decreases and eventually extinguished.</li>
<li data-marpit-fragment="3">the CO core contracts, the envelope expands.</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p>the main contribution to the stellar luminosity is <strong>primarily the He-burning shell</strong>.</p>
</li>
<li data-marpit-fragment="5">
<p>The ashes build the mass of the CO core which becomes <strong>degenerate</strong>.</p>
</li>
</ul>
</section>

</li>

<li>In our above example model above, the <em>Second Dredge Up</em> occurs at point <strong>K</strong>.</li>

<h4 id="asymptotic-giant-branch-agb---second-dredge-up-2du-1">Asymptotic Giant Branch (AGB) - Second Dredge-Up (2DU)</h4>
<p><strong>Second Dredge Up:</strong> Due to the expansion of the envelope, which leads to cooling and increase of the opacity, as well as the increasing energy production from the He-burning shell.</p>
<ul>
<li><strong>For lower mass stars (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.516ex;" xmlns="http://www.w3.org/2000/svg" width="7.147ex" height="2.172ex" role="img" focusable="false" viewBox="0 -732 3158.9 960"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2272" d="M674 732Q682 732 688 726T694 711T687 697Q686 696 417 568L151 442L399 324Q687 188 691 183Q694 177 694 172Q694 154 676 152H670L382 288Q92 425 90 427Q83 432 83 444Q84 455 96 461Q104 465 382 596T665 730Q669 732 674 732ZM56 -194Q56 -107 106 -51T222 6Q260 6 296 -12T362 -56T420 -108T483 -153T554 -171Q616 -171 654 -128T694 -29Q696 6 708 6Q722 6 722 -26Q722 -102 676 -164T557 -227Q518 -227 481 -209T415 -165T358 -113T294 -69T223 -51Q163 -51 125 -93T83 -196Q81 -228 69 -228Q56 -228 56 -202V-194Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g><g data-mml-node="msub" transform="translate(1555.8,0)"><g data-mml-node="mi"><path data-c="1D440" d="M289 629Q289 635 232 637Q208 637 201 638T194 648Q194 649 196 659Q197 662 198 666T199 671T201 676T203 679T207 681T212 683T220 683T232 684Q238 684 262 684T307 683Q386 683 398 683T414 678Q415 674 451 396L487 117L510 154Q534 190 574 254T662 394Q837 673 839 675Q840 676 842 678T846 681L852 683H948Q965 683 988 683T1017 684Q1051 684 1051 673Q1051 668 1048 656T1045 643Q1041 637 1008 637Q968 636 957 634T939 623Q936 618 867 340T797 59Q797 55 798 54T805 50T822 48T855 46H886Q892 37 892 35Q892 19 885 5Q880 0 869 0Q864 0 828 1T736 2Q675 2 644 2T609 1Q592 1 592 11Q592 13 594 25Q598 41 602 43T625 46Q652 46 685 49Q699 52 704 61Q706 65 742 207T813 490T848 631L654 322Q458 10 </ul>

<h3 id="asymptotic-giant-branch-agb---thermally-pulsing---agb-phase-tp-agb">Asymptotic Giant Branch (AGB) - Thermally Pulsing - AGB phase (TP-AGB)</h3>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/double_shell_burning.png?raw=true" width="450" align="right" /></p>

<header>AST400A</header>
<h4 id="asymptotic-giant-branch-agb---thermally-pulsing---agb-phase-tp-agb-1">Asymptotic Giant Branch (AGB) - Thermally Pulsing - AGB phase (TP-AGB)</h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/double_shell_burning.png?raw=true" width="450" align="right" /></p>
<p><em><strong>double shell burning scenario</strong>:</em> the He-shell burns in an unstable configuration and leads to <strong>thermal pulses</strong> - this is the <strong>Thermally Pulsing - AGB phase</strong></p>
<ul>
<li data-marpit-fragment="1">The pulses are followed by mixing events leading to the <em><strong>production of unique nucleosynthesis events</strong></em> and making the envelope and atmosphere more <strong>carbon-rich</strong>.</li>
</ul>
</section>

<h4 id="brief-aside-about-thin-shells">Brief aside about &quot;thin&quot; shells</h4>
<p>In Sec 7.5.2, <em>secular</em> stability - the stability of thermal equilibrium is discussed and in particular for a <strong>thin burning shell</strong>:</p>

<h3 id="asymptotic-giant-branch-agb---tp-agb-and-dredge-up">Asymptotic Giant Branch (AGB) - TP-AGB and Dredge-Up</h3>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/tp_schematic.png?raw=true" width="600" align="right" /></p>
<ul>
<li data-marpit-fragment="1">When the H-shell is reignited:
<ul>
<li data-marpit-fragment="2">and the He-burning shell beneath it is <strong>geometrically thin</strong> and <strong>unstable</strong>.</li>
<li data-marpit-fragment="3"><em>thermal pulses of the He-shell</em> occur - thermonuclear runaway called a <strong>Helium Shell Flash</strong>.</li>
</ul>
</li>
</ul>

<h3 id="asymptotic-giant-branch-agb---tp-agb-and-dredge-up-2">Asymptotic Giant Branch (AGB) - TP-AGB and Dredge-Up</h3>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/tp_schematic.png?raw=true" width="600" align="right" /></p>
<p>TP-AGB Steps:</p>
<ul>
<li data-marpit-fragment="1">
<ol>
<li>H-shell burning adds mass (He) to the intershell region</li>
</ol>
</li>
<li data-marpit-fragment="2">
<ol start="2">
<li>Once a critical intershell mass is reached:</li>
</ol>
<ul>
<li data-marpit-fragment="3">He-shell is reignited in an unstable fashion leading to thermonuclear runaway called a <strong>Helium Shell Flash</strong>.</li>
</ul>
</li>
</ul>
</section>

</li>
<li data-marpit-fragment="2">
<p>Drive an intershell convective zone (ICZ) leading to dredge up event that mixes synthesized material upward.</p>
</li>
<li data-marpit-fragment="3">
<p>The energy from the flash mostly goes into the expansion of the intershell region, allowing the He-shell to expand and cool.</p>
<ul>
<li data-marpit-fragment="4">The flash fizzles out and dies, the <strong>H-shell is extinguished</strong> and a phase of stable <strong>He-shell burning</strong> further grows the CO core.</li>
</ul>
</li>
</ul>

<header>AST400A</header>
<h4 id="asymptotic-giant-branch-agb---tp-agb-and-dredge-up-4">Asymptotic Giant Branch (AGB) - TP-AGB and Dredge-Up</h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/tp_schematic.png?raw=true" width="500" align="right" /></p>
<ul>
<li data-marpit-fragment="1">
<p>Expansion and cooling can allow for a third dredge up (3DU).</p>
<ul>
<li data-marpit-fragment="2">3DU is used for <strong>dredge up following thermal pulses</strong> even for stars without a 2DU event (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.516ex;" xmlns="http://www.w3.org/2000/svg" width="7.147ex" height="2.172ex" role="img" focusable="false" viewBox="0 -732 3158.9 960"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2272" d="M674 732Q682 732 688 726T694 711T687 697Q686 696 417 568L151 442L399 324Q687 188 691 183Q694 177 694 172Q694 154 676 152H670L382 288Q92 425 90 427Q83 432 83 444Q84 455 96 461Q104 465 382 596T665 730Q669 732 674 732ZM56 -194Q56 -107 106 -51T222 6Q260 6 296 -12T362 -56T420 -108T483 -153T554 -171Q616 -171 654 -128T694 -29Q696 6 708 6Q722 6 722 -26Q722 -102 676 -164T557 -227Q518 -227 481 -209T415 -165T358 -113T294 -69T223 -51Q163 -51 125 -93T83 -196Q81 -228 69 -228Q56 -228 56 -202V-194Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g><g data-mml-node="msub" transform="translate(1555.8,0)"><g data-mml-node="mi"><path data-c="1D440" d="M289 629Q289 635 232 637Q208 637 201 638T194 648Q194 649 196 659Q197 662 198 666T199 671T201 676T203 679T207 681T212 683T220 683T232 684Q238 684 262 684T307 683Q386 683 398 683T414 678Q415 674 451 396L487 117L510 154Q534 190 574 254T662 394Q837 673 839 675Q840 676 842 678T846 681L852 683H948Q965 683 988 683T1017 684Q1051 684 1051 673Q1051 668 1048 656T1045 643Q1041 637 1008 637Q968 636 957 634T939 623Q936 618 867 340T797 59Q797 55 798 54T805 50T822 48T855 46H886Q892 37 892 35Q892 19 885 5Q880 0 869 0Q864 0 828 1T736 2Q675 2 644 2T609 1Q592 1 592 11Q592 13 594 </ul>
</li>
<li data-marpit-fragment="3">
<p>Following 3DU, the <strong>He-shell is extinguished</strong>, the <strong>H-shell is reignited</strong> and the process repeats.</p>
<ul>
<li data-marpit-fragment="4">The &quot;interpulse period&quot; depends of the core mass and can last from 50,000 years to less than 1000 years.</li>
</ul>
</li>
</ul>
</section>

<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/tp_and_3du.png?raw=true" width="400" align="right" /></p>
<p>TP-AGB Takeaways:</p>
<ul>
<li data-marpit-fragment="1">the pulse cycle can repeat many times</li>
<li data-marpit-fragment="2">the pulse amplitude (the maximum <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.357ex;" xmlns="http://www.w3.org/2000/svg" width="3.639ex" height="1.902ex" role="img" focusable="false" viewBox="0 -683 1608.3 840.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88L243 52Q243 48 252 48T311 46H328Q360 46 379 47T428 54T478 72T522 106T564 161Q580 191 594 228T611 270Q616 273 628 273H641Q647 264 647 262T627 203T583 83T557 9Q555 4 553 3T537 0T494 -1Q483 -1 418 -1T294 0H116Q32 0 32 10Q32 17 34 24Q39 43 44 45Q48 46 59 46H65Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Q285 635 228 637Z"></path></g><g data-mml-node="TeXAtom" transform="translate(714,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="48" d="M128 622Q121 629 117 631T101 634T58 637H25V683H36Q57 680 180 680Q315 680 324 683H335V637H302Q262 636 251 634T233 622L232 500V378H517V622Q510 629 506 631T490 634T447 637H414V683H425Q446 680 569 680Q704 680 713 683H724V637H691Q651 636 640 634T622 622V61Q628 51 639 49T691 46H724V0H713Q692 3 569 3Q434 3 425 0H414V46H447Q489 47 498 49T517 61V332H232V197L233 61Q239 51 250 49T302 46H335V0H324Q303 3 180 3Q45 3 36 0H25V46H58Q100 47 109 49T128 61V622Z"></path></g><g data-mml-node="mi" transform="translate(750,0)"><path data-c="65" d="M28 218Q28 273 48 318T98 391T163 433T229 448Q282 448 320 430T378 380T406 316T415 245Q415 238 408 231H126V216Q126 68 226 36Q246 30 270 30Q312 30 342 62Q359 79 369 104L379 128Q382 131 395 131H398Q415 131 415 121Q415 117 412 108Q393 53 349 21T250 -11Q155 -11 92 58T28 218ZM333 275Q32 <li data-marpit-fragment="3">3DU might not occur until after several pulses</li>
<li data-marpit-fragment="4">3DU is unique that it not only brings up H-burning products but also <strong>He-burning</strong> products to the surface.</li>
</ul>

<h4 id="nucleosynthesis-and-abundance-changes-on-the-agb">Nucleosynthesis and abundance changes on the AGB</h4>
<p><strong>Production of heavy elements: the s-process</strong></p>
<ul>
<li data-marpit-fragment="1">Spectroscopic observations show that many AGB stars are enriched in elements, such as Zr, Y, Sr, Tc, Ba, La and Pb.</li>
</ul>
<p>These elements can be formed in AGB stars via the <a href="https://en.wikipedia.org/wiki/S-process"><strong>slow neutron-capture process (s-process)</strong></a>. This process requires free neutrons.</p>

he He-shell flash if the temperature is sufficiently high in more massive AGB stars.</li>

384 583Q530 583 626 485T722 250Q722 110 625 14T390 -83Q249 -83 153 14T56 250ZM682 250Q682 322 649 387T546 497T381 542Q272 542 184 459T95 250Q95 132 178 45T389 -42Q515 -42 598 45T682 250ZM311 250Q311 285 332 304T375 328Q376 328 382 328T392 329Q424 326 445 305T466 250Q466 217 445 195T389 172Q354 172 333 195T311 250Z"></path></g></g></g></g></g></svg></mjx-container></strong>:
<ul>
<li data-marpit-fragment="2">the temperature at the base of the convective H-shell during the interpulse phase can lead to H-burning on material in the convective envelope, known as <strong>Hot Bottom Burning</strong>.</li>
</ul>
</li>
</ul>
<p>The two outcomes of this burning are:</p>
<ul>
<li data-marpit-fragment="3">increase in the luminosity away from the relation earlier.</li>
<li data-marpit-fragment="4">transforming the <strong>dredged up C into N</strong>, preventing the stars from becoming carbon stars.</li>
</ul>
</section>

<header>AST400A</header>
<h3 id="mass-loss-and-termination-of-the-agb-phase">Mass loss and termination of the AGB phase</h3>
<ul>
<li data-marpit-fragment="1">Stars on the TP-AGB phase can experience many pulses, limited by the decreasing mass of the H-envelope and the mass of the core.
<ul>
<li data-marpit-fragment="2">the duration of this phase (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="13.433ex" height="2.14ex" role="img" focusable="false" viewBox="0 -864 5937.2 946"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(1778,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z"></path></g><g data-mml-node="mn" transform="translate(2778.2,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><g data-mml-node="mo" transform="translate(3500.4,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485 </ul>
</li>
</ul>
<p><strong>AGB mass loss</strong>: The mechanisms driving such strong mass loss are not yet completely understood:</p>
<ul>
<li data-marpit-fragment="3">but a combination of dynamical pulsations and</li>
<li data-marpit-fragment="4">radiation pressure on dust particles formed in the atmosphere probably plays an essential role.</li>
</ul>
</section>

<ul>
<li data-marpit-fragment="1">

</li>
<li data-marpit-fragment="2">

<h4 id="mass-loss-and-termination-of-the-agb-phase-2">Mass loss and termination of the AGB phase</h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/agb_mass_loss.png?raw=true" width="650" align="right" /></p>
<p><em><strong>Mass loss of AGB stars</strong></em></p>
<ul>
<li data-marpit-fragment="1">

</li>

<h4 id="post-agb-evolution">Post-AGB Evolution</h4>
<p><img src="https://github.com/carlnotsagan/ast545sp25/blob/main/lectures/week14/post_agb_schematic.png?raw=true" width="500" align="right" /></p>
<p>We can identify a few next epochs:</p>
<ul>
<li data-marpit-fragment="1">
<p>Decrease in radius at <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.301ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.529ex" role="img" focusable="false" viewBox="0 -367 778 234"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="223C" d="M55 166Q55 241 101 304T222 367Q260 367 296 349T362 304T421 252T484 208T554 189Q616 189 655 236T694 338Q694 350 698 358T708 367Q722 367 722 334Q722 260 677 197T562 134H554Q517 134 481 152T414 196T355 248T292 293T223 311Q179 311 145 286Q109 257 96 218T80 156T69 133Q55 133 55 166Z"></path></g></g></g></svg></mjx-container> constant <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.541ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 681 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88L243 52Q243 48 252 48T311 46H328Q360 46 379 47T428 54T478 72T522 106T564 161Q580 191 594 228T611 270Q616 273 628 273H641Q647 264 647 262T627 203T583 83T557 9Q555 4 553 3T537 0T494 -1Q483 -1 418 -1T294 0H116Q32 0 32 10Q32 17 34 24Q39 43 44 45Q48 46 59 46H65Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Q285 635 228 637Z"></path></g></g></g></svg></mjx-container> via H-burning shell, follows the core-mass <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.541ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 681 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data- </li>
<li data-marpit-fragment="2">

<ul>
<li data-marpit-fragment="3">via weak mass loss at the surface</li>

</li>
